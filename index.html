<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antrean 1v1</title>
<style>
:root{--yellow:#ffe66d;--green:#57e889;--red:#ff5b5b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#101114;color:#fff}
body.live{background:transparent;overflow:hidden}
.overlay{display:inline-block;max-width:100vw;padding:clamp(5px,1vw,12px) clamp(7px,1.6vw,16px);border-radius:clamp(5px,1vw,11px);background:rgba(0,0,0,.58);font-weight:800;line-height:1.2;overflow:hidden}
.row{font-size:clamp(13px,2.5vw,30px);white-space:nowrap}
.num{color:var(--yellow);display:inline-block;min-width:1.4ch;text-align:center}
.status{margin-top:3px;font-size:clamp(10px,1.6vw,20px);color:var(--green)}
.closed .queue{display:none}.closed .closemsg{display:block}
.closemsg{display:none;color:#fff;font-size:clamp(16px,3vw,32px);white-space:nowrap}
.closed .status{color:var(--red)}
.controls{max-width:560px;margin:18px auto;padding:18px;border-radius:16px;background:#1b1d22}
.controls h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr auto 72px auto;gap:8px;align-items:center}
button{border:0;border-radius:10px;padding:10px 15px;font-size:20px;font-weight:800}
input{width:72px;text-align:center;font-size:20px;border:0;border-radius:10px;padding:9px}
.toggle{width:100%;margin-top:14px;background:var(--red)}
.reset{width:100%;margin-top:8px}
.help{opacity:.7;font-size:13px;line-height:1.45;margin-top:12px}
.conn{font-size:13px;margin-top:10px}
.ok{color:var(--green)}.bad{color:var(--red)}
body.control .overlay{margin:18px}
body.live .controls{display:none}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="queue">
    <div class="row">1V1 HV FREE | FOLLOW (<span id="follow" class="num">0</span>)</div>
    <div class="row">SKIP 1K | ANTRIAN (<span id="skip" class="num">0</span>)</div>
  </div>
  <div class="closemsg">CLOSE!!</div>
  <div class="status" id="status">● OPEN</div>
</div>

<section class="controls" id="controls">
  <h2>🎮 CONTROL ANTREAN</h2>
  <div class="grid">
    <b>FOLLOW</b><button onclick="change('follow',-1)">−</button><input id="followInput" type="number" min="0" value="0"><button onclick="change('follow',1)">+</button>
    <b>SKIP 1K</b><button onclick="change('skip',-1)">−</button><input id="skipInput" type="number" min="0" value="0"><button onclick="change('skip',1)">+</button>
  </div>
  <button class="toggle" id="toggleBtn" onclick="toggleOpen()">🔴 CLOSE!!</button>
  <button class="reset" onclick="resetAll()">RESET</button>
  <div class="conn" id="conn">Connecting...</div>
  <div class="help">Numpad: <b>+</b> Follow +1 · <b>−</b> Follow −1 · <b>*</b> Skip +1 · <b>/</b> Skip −1 · <b>Numpad Enter</b> Open/Close · <b>0</b> Reset.</div>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyA1paeEhiMMW167OnWQZj1LGoGdXQDhavg",
 authDomain:"antrean-by-dikarchetype.firebaseapp.com",
 databaseURL:"https://antrean-by-dikarchetype-default-rtdb.asia-southeast1.firebasedatabase.app/",
 projectId:"antrean-by-dikarchetype",
 storageBucket:"antrean-by-dikarchetype.firebasestorage.app",
 messagingSenderId:"387679607468",
 appId:"1:387679607468:web:a4a6e164edc6ac59be1d09",
 measurementId:"G-7VHCXMCZZJ"
};

const app=initializeApp(firebaseConfig),db=getDatabase(app),stateRef=ref(db,"antrean1v1/state");
const q=new URLSearchParams(location.search),isLive=q.has("live");
if(isLive){document.body.className="live";document.getElementById("controls").remove()}else document.body.className="control";

let state={follow:0,skip:0,open:true};
function render(s){
 state={follow:Math.max(0,Number(s?.follow)||0),skip:Math.max(0,Number(s?.skip)||0),open:s?.open!==false};
 document.getElementById("follow").textContent=state.follow;
 document.getElementById("skip").textContent=state.skip;
 document.getElementById("overlay").classList.toggle("closed",!state.open);
 document.getElementById("status").textContent=state.open?"● OPEN":"● CLOSED";
 document.title=state.open?"🟢 LIVE — Antrean 1v1":"🔴 CLOSE!! — Antrean 1v1";
 if(!isLive){document.getElementById("followInput").value=state.follow;document.getElementById("skipInput").value=state.skip;document.getElementById("toggleBtn").textContent=state.open?"🔴 CLOSE!!":"🟢 OPEN"}
}
onValue(stateRef,s=>{render(s.val()||{follow:0,skip:0,open:true});if(!isLive)document.getElementById("conn").innerHTML='<span class="ok">● Tersambung realtime</span>'},e=>{if(!isLive)document.getElementById("conn").innerHTML='<span class="bad">● Gagal tersambung</span>'});
async function write(s){try{await set(stateRef,s)}catch(e){if(!isLive)document.getElementById("conn").innerHTML='<span class="bad">● Gagal menyimpan</span>'}}
window.change=(k,n)=>write({...state,[k]:Math.max(0,state[k]+n)});
window.toggleOpen=()=>write({...state,open:!state.open});
window.resetAll=()=>write({follow:0,skip:0,open:true});
document.getElementById("followInput").onchange=e=>write({...state,follow:Math.max(0,parseInt(e.target.value)||0)});
document.getElementById("skipInput").onchange=e=>write({...state,skip:Math.max(0,parseInt(e.target.value)||0)});
document.addEventListener("keydown",e=>{
 if(isLive||e.target.tagName==="INPUT")return;
 if(e.code==="NumpadAdd"){e.preventDefault();change("follow",1)}
 else if(e.code==="NumpadSubtract"){e.preventDefault();change("follow",-1)}
 else if(e.code==="NumpadMultiply"){e.preventDefault();change("skip",1)}
 else if(e.code==="NumpadDivide"){e.preventDefault();change("skip",-1)}
 else if(e.code==="NumpadEnter"){e.preventDefault();toggleOpen()}
 else if(e.code==="Numpad0"){e.preventDefault();resetAll()}
});
</script>
</body>
</html>
