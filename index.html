<!doctype html>

<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Text Editor</title><style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#101114;
  color:#fff;
}

body.live{
  background:transparent;
  overflow:hidden;
}

/* =========================
   EDITOR
========================= */

.editor{
  display:inline-block;

  max-width:100vw;

  min-width:30px;

  padding:clamp(7px,1vw,12px)
          clamp(9px,1.6vw,16px);

  background:transparent;

  font-size:clamp(13px,2.5vw,30px);

  font-weight:800;
  line-height:1.2;

  color:#fff;

  outline:none;

  white-space:pre-wrap;
  word-break:break-word;

  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
    -2px  0 0 #000,
     2px  0 0 #000,
     0  -2px 0 #000,
     0   2px 0 #000;
}

/* =========================
   PLACEHOLDER
========================= */

.editor:empty::before{
  content:"text anda";
  color:#fff;
}

/* =========================
   LIVE MODE
========================= */

body.live .editor{
  cursor:default;
  user-select:none;
}

</style></head><body><div
  class="editor"
  id="editor"
  contenteditable="true"
  spellcheck="false"
></div><script type="module">

/* =========================
   FIREBASE IMPORT
========================= */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyA1paeEhiMMW167OnWQZj1LGoGdXQDhavg",

  authDomain:
  "antrean-by-dikarchetype.firebaseapp.com",

  databaseURL:
  "https://antrean-by-dikarchetype-default-rtdb.asia-southeast1.firebasedatabase.app/",

  projectId:
  "antrean-by-dikarchetype",

  storageBucket:
  "antrean-by-dikarchetype.firebasestorage.app",

  messagingSenderId:
  "387679607468",

  appId:
  "1:387679607468:web:a4a6e164edc6ac59be1d09",

  measurementId:
  "G-7VHCXMCZZJ"

};


/* =========================
   FIREBASE INIT
========================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =========================
   TEXT DATABASE
========================= */

const textRef =
  ref(
    db,
    "textEditor/text"
  );


/* =========================
   LIVE MODE
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const isLive =
  params.has("live");


if(isLive){

  document.body.className = "live";

}


/* =========================
   EDITOR
========================= */

const editor =
  document.getElementById("editor");


/* =========================
   LOAD TEXT
========================= */

onValue(

  textRef,

  snapshot => {

    const text =
      snapshot.val();

    /*
      Hanya update kalau
      berbeda dengan isi editor.
    */

    if(
      text !== null &&
      text !== editor.innerText
    ){

      editor.innerText =
        text;

    }

  }

);


/* =========================
   SAVE TEXT
========================= */

let saveTimer;

editor.addEventListener(
  "input",
  function(){

    clearTimeout(saveTimer);

    saveTimer =
      setTimeout(
        async function(){

          try{

            await set(
              textRef,
              editor.innerText
            );

          }catch(error){

            console.error(
              "Firebase error:",
              error
            );

          }

        },
        150
      );

  }
);


/* =========================
   LIVE MODE
========================= */

if(isLive){

  /*
    Tidak bisa diedit
    saat ?live
  */

  editor.contentEditable =
    "false";

}

</script></body>
</html>
